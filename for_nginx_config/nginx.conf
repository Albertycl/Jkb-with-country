events{
}


http {

    include mime.types;

    gzip on;
    gzip_comp_level 3;
    gzip_types text/css;
    gzip_types text/javascript;


    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;


        location / {
            try_files $uri $uri/ /index.html;


        }
        location ~*.(css|js|jpg|png)$ {
            access_log off;
            add_header Cache-Control public;
            add_header Pragma public;
            add_header Vary Accept-Encoding;
            expires 60m;
        }

    }
}